<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0a0b0f; --panel:#12141b; --panel2:#0f1117;
    --teal:#2ee6cf; --cream:#f3f1ea; --muted:#878b99; --line:#20232e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    position:relative;background:var(--bg);overflow:hidden;
    font-family:"Space Grotesk Sb","Space Grotesk Md",sans-serif;
    background-image:radial-gradient(circle, #ffffff14 1px, transparent 1.4px);
    background-size:26px 26px;background-position:0 0;
  }
  .mono{font-family:"JetBrainsMono Nerd Font Mono","JetBrains Mono",monospace}
  .mark{color:var(--teal)}

  .lockup{position:absolute;top:60px;left:64px;display:flex;align-items:center;gap:15px}
  .lockup .mark{width:44px;height:44px}
  .lockup .odk{font-size:36px;font-weight:700;color:var(--cream);letter-spacing:.5px;line-height:1}
  .lockup .sub{font-size:17px;color:var(--muted);letter-spacing:1px;line-height:1}

  .headline{position:absolute;top:120px;left:64px;font-size:64px;font-weight:700;color:var(--cream);letter-spacing:-.5px}
  .headline .t{color:var(--teal)}

  .schema{position:absolute;left:64px;top:354px;width:288px;height:88px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel2);padding:20px 22px}
  .schema .lbl{font-size:25px;font-weight:600;color:var(--cream);line-height:1.1}
  .schema .types{font-size:16px;color:var(--muted);margin-top:9px;letter-spacing:0;white-space:nowrap}

  .ir{position:absolute;left:524px;top:322px;width:152px;height:152px;border:2px solid var(--teal);border-radius:22px;background:#0e1a1c;display:flex;align-items:center;justify-content:center}
  .ir .mark{width:94px;height:94px}

  .target{position:absolute;left:898px;width:238px;height:68px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);display:flex;align-items:center;padding-left:26px;font-size:25px;font-weight:600;color:var(--cream)}
  .t0{top:241px}.t1{top:323px}.t2{top:405px}.t3{top:487px}

  .caption{position:absolute;left:64px;bottom:40px;font-size:20px;color:var(--muted);letter-spacing:.3px}
  .caption .ar{color:var(--teal)}
  svg.wires{position:absolute;inset:0;width:1200px;height:630px}
</style>
</head>
